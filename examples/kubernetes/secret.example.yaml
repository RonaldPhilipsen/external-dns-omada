# Credentials for the Omada webhook sidecar. Replace the values before use;
# the external-dns container does not read any of these keys.
apiVersion: v1
kind: Secret
metadata:
  name: external-dns-omada
stringData:
  OMADA_SERVER: "https://192.168.0.1:8043"
  OMADA_ID: "OM-XXXXXXXX"
  OMADA_CLIENT_ID: "replace-me"
  OMADA_CLIENT_SECRET: "replace-me"
  OMADA_SITE_NAME: "Home"
  OMADA_TLS_SKIP_VERIFY: "false"
